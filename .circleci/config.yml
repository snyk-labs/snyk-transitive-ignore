version: 2.1
orbs:
    snyk: snyk/snyk@2.3.0
jobs:
    build-test-publish:
        docker:
            - image: cimg/node:24.22
        steps:
            - checkout
            - run: npm install semantic-release@25.0.9 @semantic-release/exec@7.1.0 --save-dev
            - run: npm install
            - run: npm test
            - snyk/scan:
                fail-on-issues: true
                monitor-on-build: true
                severity-threshold: high
                token-variable: SNYK_TOKEN
            - run:
                name: Publish to npm with OIDC
                command: |
                    export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
                    npx semantic-release@25.0.9
    build-test:
        docker:
            - image: cimg/node:24.22
        steps:
            - checkout
            - run: npm install
            - run: npm test
            - snyk/scan:
                fail-on-issues: true
                monitor-on-build: false
                severity-threshold: high
                token-variable: SNYK_TOKEN
            - run: npx tsc
    build-test-from-fork:
        docker:
            - image: cimg/node:24.22
        steps:
            - checkout
            - run: npm install
            - run: npm test
            - run: npx tsc

workflows:
    version: 2.1
    build-test-publish:
        jobs:
            - build-test-publish:
                context: SNYK
                filters:
                    branches:
                        only:
                            - master
    build-test:
        jobs:
            - build-test:
                context: SNYK
                filters:
                    branches:
                        ignore:
                        - master
                        - /pull\/[0-9]+/
            - build-test-from-fork:
                filters:
                    branches:
                        only:
                        - /pull\/[0-9]+/

